<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1020" />
    <!-- Niente manifest dell'app: "Aggiungi a Home" deve aprire questa pagina, non l'app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prova voce" />
    <title>Prova voce</title>
    <style>
      html, body { margin: 0; background: #0B1020; color: #E8ECF5; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      button {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 2px solid #C9D2E6;
        background: #0B1020;
        color: #E8ECF5;
        font-size: 32px;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled { opacity: 0.4; }
      #frase { font-size: 24px; min-height: 1.4em; margin: 0; }
      .secondario { color: #9AA4BD; font-size: 18px; margin: 0; }
      #eventi { font-size: 15px; line-height: 1.5; max-width: 100%; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <button id="parla" type="button">Parla</button>
    <p id="frase"></p>
    <p id="stato" class="secondario"></p>
    <p id="tempo" class="secondario"></p>
    <p id="modo" class="secondario"></p>
    <p id="eventi" class="secondario"></p>
    <script>
      (function () {
        var bottone = document.getElementById('parla');
        var frase = document.getElementById('frase');
        var stato = document.getElementById('stato');
        var tempo = document.getElementById('tempo');
        var modo = document.getElementById('modo');

        var installata = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        modo.textContent = installata ? 'installata' : 'nel browser';

        var Riconoscimento = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Riconoscimento) {
          stato.textContent = 'non disponibile';
          bottone.disabled = true;
          return;
        }
        stato.textContent = 'disponibile';

        var eventi = document.getElementById('eventi');

        // Una sessione per ogni tocco su "Parla". Gli eventi tardivi di una
        // sessione chiusa finiscono solo nel registro (quelli di una sessione
        // precedente con il suo numero, es. "#1 end 9,2"), non cambiano lo stato.
        var corrente = null;
        var numero = 0;
        var righe = [];

        function secondiDa(s) {
          return ((performance.now() - s.inizio) / 1000).toFixed(1).replace('.', ',');
        }

        function registra(s, nome) {
          var prefisso = corrente === s ? '' : '#' + s.numero + ' ';
          righe.push(prefisso + nome + ' ' + secondiDa(s));
          eventi.textContent = righe.join(' · ');
        }

        function mostraTempo(s) {
          tempo.textContent = secondiDa(s) + ' s';
        }

        function chiudi(s) {
          s.attiva = false;
          clearTimeout(s.timer);
          bottone.textContent = 'Parla';
        }

        function nessunRisultato(s) {
          s.concluso = true;
          mostraTempo(s);
          stato.textContent = 'nessun risultato';
        }

        function interrompi(s) {
          if (!s.attiva) return;
          if (!s.concluso) nessunRisultato(s);
          chiudi(s);
          registra(s, 'abort');
          try { s.rec.abort(); } catch (e) { registra(s, 'abort:' + e.name); }
        }

        function ferma(s) {
          // Secondo tocco su "Ferma": interrompe subito.
          if (s.fermata) {
            interrompi(s);
            return;
          }
          s.fermata = true;
          registra(s, 'stop');
          try { s.rec.stop(); } catch (e) { registra(s, 'stop:' + e.name); }
          // iOS a volte non risponde più: dopo 3 s senza "end" si interrompe.
          s.timer = setTimeout(function () { interrompi(s); }, 3000);
        }

        function parla() {
          var rec = new Riconoscimento();
          rec.lang = 'it-IT';
          rec.continuous = false;
          rec.interimResults = true;
          numero += 1;
          var s = { rec: rec, numero: numero, inizio: performance.now(),
                    attiva: true, concluso: false, fermata: false, timer: null };
          corrente = s;
          righe = [];

          ['audiostart', 'soundstart', 'speechstart', 'speechend', 'soundend', 'audioend']
            .forEach(function (nome) {
              rec.addEventListener(nome, function () { registra(s, nome); });
            });

          rec.onresult = function (event) {
            var parti = [];
            var definitiva = false;
            for (var i = 0; i < event.results.length; i++) {
              var parte = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                parte += ' (definitiva)';
                definitiva = true;
              }
              parti.push(parte);
            }
            var testo = parti.join(' ');
            registra(s, 'result:' + testo);
            // Anche a sessione chiusa (risultato dopo abort) le parole si vedono.
            if (corrente === s) frase.textContent = testo;
            if (!s.attiva) return;
            if (definitiva) {
              s.concluso = true;
              mostraTempo(s);
              stato.textContent = 'disponibile';
            }
          };
          rec.onnomatch = function () {
            registra(s, 'nomatch');
            if (s.attiva) nessunRisultato(s);
          };
          rec.onerror = function (event) {
            registra(s, 'error:' + event.error);
            if (!s.attiva) return;
            s.concluso = true;
            mostraTempo(s);
            stato.textContent = 'errore: ' + event.error;
          };
          rec.onend = function () {
            registra(s, 'end');
            if (!s.attiva) return;
            if (!s.concluso) nessunRisultato(s);
            chiudi(s);
          };

          frase.textContent = '';
          tempo.textContent = '';
          eventi.textContent = '';
          stato.textContent = 'in ascolto…';
          bottone.textContent = 'Ferma';
          try {
            rec.start();
          } catch (e) {
            registra(s, 'start:' + e.name);
            s.concluso = true;
            mostraTempo(s);
            stato.textContent = 'errore: ' + (e && e.name ? e.name : String(e));
            chiudi(s);
          }
        }

        bottone.addEventListener('click', function () {
          if (corrente && corrente.attiva) {
            ferma(corrente);
          } else {
            parla();
          }
        });
      })();
    </script>
  </body>
</html>
